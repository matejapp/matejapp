name: Profile metrics

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: matejapp
          filename: metrics-calendar.svg
          template: classic
          base: ""
          config_timezone: Europe/Belgrade
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Most-used languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: matejapp
          filename: metrics-languages.svg
          template: classic
          base: ""
          config_timezone: Europe/Belgrade
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_threshold: 2%
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, shell, dockerfile
          plugin_languages_colors: >-
            c#:#8B5CF6, typescript:#22C55E, python:#A855F7,
            javascript:#84CC16, java:#7C3AED

      - name: Coding habits and recent activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: matejapp
          filename: metrics-activity.svg
          template: classic
          base: ""
          config_timezone: Europe/Belgrade
          plugin_habits: yes
          plugin_habits_from: 500
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes
          plugin_activity: yes
          plugin_activity_limit: 6
          plugin_activity_days: 30
          plugin_activity_visibility: public
          plugin_activity_timestamps: yes
          plugin_activity_filter: push, issue, pr, release, review, ref/create
